<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>A Bubble — VR</title>
    </head>

    <body>
        <div id="app"></div>

        <!-- Shown until the splat is ready, then replaced by the depth readout. -->
        <div id="status">Loading bubble…</div>

        <!-- Desktop-only rehearsal HUD. Hidden inside an XR session, since DOM
             is not visible to the headset. Toggle with H. -->
        <div id="hud" hidden>
            <div id="hudDepth">—</div>
            <div id="hudDetail"></div>
        </div>

        <div id="hint">
            Click to look around · look <strong>up</strong> to rise,
            <strong>down</strong> to sink · <strong>R</strong> resets ·
            <strong>H</strong> toggles readout
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
