<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>GS Visualiser</title>
    </head>

    <body>
        <div id="app"></div>

        <!-- Scene picker, shown by a bare URL and filled in by src/picker.js.
             Skipped entirely when the URL already names a scene. -->
        <div id="picker" hidden></div>

        <!-- Shown while the splat loads, then replaced by the readout. Both
             are filled in from the scene entry, so neither mentions a scene
             here. -->
        <div id="status" hidden></div>

        <!-- Desktop-only rehearsal HUD. Hidden inside an XR session, since DOM
             is not visible to the headset. Toggle with H. -->
        <div id="hud" hidden>
            <div id="hudDepth">—</div>
            <div id="hudDetail"></div>
        </div>

        <div id="hint" hidden></div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
